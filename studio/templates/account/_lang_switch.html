{% load i18n %}{% get_current_language as LANG %}{% get_available_languages as LANGUAGES %}{% get_language_info_list for LANGUAGES as langs %}
<form method="post" action="{% url 'set_language' %}" class="auth-foot lang-switch">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% for l in langs %}<button class="linklike{% if l.code == LANG %} current{% endif %}" name="language" value="{{ l.code }}">{{ l.name_local|capfirst }}</button>{% if not forloop.last %} · {% endif %}{% endfor %}
</form>
